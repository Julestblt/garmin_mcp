name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run unit and mocked integration tests
      run: uv run --frozen pytest tests/integration tests/unit -q --strict-markers
      timeout-minutes: 5

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client
    - name: Apply migrations against disposable PostgreSQL
      env:
        DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      run: bash scripts/validate_migrations.sh

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
    - name: Verify lock file
      run: uv lock --check
    - name: Check Python syntax
      run: uv run --frozen python -m compileall -q src/garmin_mcp
    - name: Build package
      run: uv build
    - name: Build Docker image
      run: docker build -t stride-garmin:ci .
