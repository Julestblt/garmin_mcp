name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run unit and mocked integration tests
      run: uv run --frozen pytest tests/integration tests/unit -q --strict-markers
      timeout-minutes: 5

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
    - name: Verify lock file
      run: uv lock --check
    - name: Check Python syntax
      run: uv run --frozen python -m compileall -q src/garmin_mcp
    - name: Build package
      run: uv build
    - name: Build Docker image
      run: docker build -t stride-garmin:ci .
